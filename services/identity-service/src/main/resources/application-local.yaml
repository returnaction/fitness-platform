server:
  address: 127.0.0.1

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./services/identity-service/.env[.properties]

logging:
  level:
    io.github.returnaction.fitness.identity: DEBUG
    # HikariCP сам выводит фактические настройки пула, включая minimumIdle и
    # maximumPoolSize. Пароль подключения в этом выводе маскируется.
    com.zaxxer.hikari.HikariConfig: DEBUG
