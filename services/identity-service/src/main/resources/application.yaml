spring:
  application:
    name: identity-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Значения задаются явно в .env локальной среды или в переменных окружения
      # сервера. У них нет скрытого значения по умолчанию.
      minimum-idle: ${DATABASE_POOL_MIN_IDLE}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

identity:
  accounts-grpc:
    enabled: ${IDENTITY_ACCOUNTS_GRPC_ENABLED}
    host: ${IDENTITY_ACCOUNTS_GRPC_HOST}
    port: ${IDENTITY_ACCOUNTS_GRPC_PORT}
    certificate: ${IDENTITY_ACCOUNTS_GRPC_CERTIFICATE}
    private-key: ${IDENTITY_ACCOUNTS_GRPC_PRIVATE_KEY}
    trust-certificate: ${IDENTITY_ACCOUNTS_GRPC_TRUST_CERTIFICATE}
  registration:
    worker:
      enabled: ${IDENTITY_REGISTRATION_WORKER_ENABLED}
      poll-ms: ${IDENTITY_REGISTRATION_WORKER_POLL_MS}
      batch-size: ${IDENTITY_REGISTRATION_WORKER_BATCH_SIZE}
      lease-seconds: ${IDENTITY_REGISTRATION_WORKER_LEASE_SECONDS}
      retry-initial-seconds: ${IDENTITY_REGISTRATION_RETRY_INITIAL_SECONDS}
      retry-max-seconds: ${IDENTITY_REGISTRATION_RETRY_MAX_SECONDS}
      jitter-fraction: ${IDENTITY_REGISTRATION_RETRY_JITTER_FRACTION}
    password:
      argon2:
        salt-length: 16
        hash-length: 32
        parallelism: 1
        memory-kib: 19456
        iterations: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  port: ${SERVER_PORT}
