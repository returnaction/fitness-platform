# Safe settings for automated tests only. PostgreSQL подменяется Testcontainers.
DATABASE_URL=jdbc:postgresql://127.0.0.1:1/test_not_for_real_use
DATABASE_USERNAME=test_user
DATABASE_PASSWORD=test_only_password
DATABASE_POOL_MIN_IDLE=2
DATABASE_POOL_MAX_SIZE=10
# Исходящий gRPC Challenge → Coins (mTLS). В тестах клиент не создаёт канал.
COINS_STAKE_GRPC_HOST=127.0.0.1
COINS_STAKE_GRPC_PORT=1
CHALLENGE_GRPC_CERTIFICATE=test-only-missing/challenge.pem
CHALLENGE_GRPC_PRIVATE_KEY=test-only-missing/challenge.key
CHALLENGE_GRPC_TRUST_CERTIFICATE=test-only-missing/ca.pem
