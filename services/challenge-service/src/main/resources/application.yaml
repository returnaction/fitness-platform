spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-null-creator-properties: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
        read-unknown-enum-values-as-null: false
        read-unknown-enum-values-using-default-value: false
    mapper:
      allow-coercion-of-scalars: false
      accept-case-insensitive-enums: false
  application:
    name: challenge-service
  profiles:
    default: local
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Не включать значения строк из подробностей ошибок PostgreSQL в логи.
      data-source-properties:
        logServerErrorDetail: false
      minimum-idle: ${DATABASE_POOL_MIN_IDLE}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: ${SERVER_PORT}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
