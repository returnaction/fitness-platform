spring:
  application:
    name: accounts-service
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Не включать значения строк из подробностей ошибок PostgreSQL в логи.
      data-source-properties:
        logServerErrorDetail: false
      # Значения задаются явно в .env локальной среды или в переменных окружения
      # сервера. У них нет скрытого значения по умолчанию.
      minimum-idle: ${DATABASE_POOL_MIN_IDLE}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  port: ${SERVER_PORT}

accounts:
  grpc:
    address: ${ACCOUNTS_GRPC_ADDRESS}
    port: ${ACCOUNTS_GRPC_PORT}
    certificate: ${ACCOUNTS_GRPC_CERTIFICATE}
    private-key: ${ACCOUNTS_GRPC_PRIVATE_KEY}
    trust-certificate: ${ACCOUNTS_GRPC_TRUST_CERTIFICATE}
