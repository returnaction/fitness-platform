spring:
  application:
    name: coins-service
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: ${DATABASE_POOL_MIN_IDLE}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: ${SERVER_PORT}
coins:
  grpc:
    enabled: ${COINS_GRPC_ENABLED}
    address: ${COINS_GRPC_ADDRESS}
    port: ${COINS_GRPC_PORT}
    certificate: ${COINS_GRPC_CERTIFICATE}
    private-key: ${COINS_GRPC_PRIVATE_KEY}
    trust-certificate: ${COINS_GRPC_TRUST_CERTIFICATE}
