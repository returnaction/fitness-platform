spring:
  application:
    name: coins-service
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Не включать значения строк из подробностей ошибок PostgreSQL в логи.
      data-source-properties:
        logServerErrorDetail: false
      minimum-idle: ${DATABASE_POOL_MIN_IDLE}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      auto-startup: ${COINS_CHALLENGE_FINISHED_CONSUMER_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: ${SERVER_PORT}
coins:
  grpc:
    address: ${COINS_GRPC_ADDRESS}
    port: ${COINS_GRPC_PORT}
    certificate: ${COINS_GRPC_CERTIFICATE}
    private-key: ${COINS_GRPC_PRIVATE_KEY}
    trust-certificate: ${COINS_GRPC_TRUST_CERTIFICATE}
  challenge:
    grpc:
      host: ${CHALLENGE_RESULTS_GRPC_HOST}
      port: ${CHALLENGE_RESULTS_GRPC_PORT}
      certificate: ${COINS_CLIENT_CERTIFICATE}
      private-key: ${COINS_CLIENT_PRIVATE_KEY}
      trust-certificate: ${CHALLENGE_RESULTS_GRPC_TRUST_CERTIFICATE}
      deadline: ${CHALLENGE_RESULTS_GRPC_DEADLINE:3s}
  settlement:
    topic: ${CHALLENGE_FINISHED_TOPIC:fitness.challenge.finished.v1}
    consumer-group: ${CHALLENGE_FINISHED_CONSUMER_GROUP:coins-service.challenge-finished}
