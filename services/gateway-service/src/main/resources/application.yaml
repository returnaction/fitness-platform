spring:
  servlet:
    encoding:
      enabled: false
    multipart:
      enabled: false
  cloud:
    gateway:
      server:
        webmvc:
          form-filter:
            enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  application:
    name: gateway-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT}
  address: ${GATEWAY_ADDRESS}

management:
  server:
    port: ${MANAGEMENT_PORT}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,jwks

gateway:
  request:
    timeout: 3s
  upstreams:
    services:
      IDENTITY:
        base-url: ${IDENTITY_HTTP_BASE_URL}
  security:
    jwks-startup:
      attempt-timeout: 3s
      retry-delay: 5s
    access-token:
      jwks-uri: ${GATEWAY_JWKS_URL}
      issuer: ${GATEWAY_JWT_ISSUER}
      audience: ${GATEWAY_JWT_AUDIENCE}
    session-verification:
      host: ${IDENTITY_SESSION_HOST}
      port: ${IDENTITY_SESSION_PORT}
      trust-certificate: ${GATEWAY_TRUST_CERTIFICATE}
      certificate: ${GATEWAY_CERTIFICATE}
      private-key: ${GATEWAY_PRIVATE_KEY}
      shutdown-timeout: ${SESSION_SHUTDOWN_TIMEOUT}

logging:
  pattern:
    level: '%5p [request_id=%X{request_id}]'
