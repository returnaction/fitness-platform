spring:
  application:
    name: gateway-service
  profiles:
    default: local
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT}
  address: ${GATEWAY_ADDRESS}

management:
  server:
    port: ${MANAGEMENT_PORT}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
