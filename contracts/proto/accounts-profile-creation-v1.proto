syntax = "proto3";

package fitness.accounts.profile.creation.v1;

option java_multiple_files = true;
option java_package = "io.github.returnaction.fitness.contracts.accounts.profile.creation.v1";
option java_outer_classname = "ProfileCreationV1Proto";

// Владелец этого контракта — сервис Accounts. Сервис Identity вызывает его
// только во время процесса регистрации (creation).
// Оба сервиса проверяют, что UUID-строки переданы в нижнем регистре (lowercase).
service ProfileCreationService {
  // Требует mTLS-аутентификацию сервиса Identity и наличие разрешения (permission)
  // identity.registration.provision. Повторные вызовы безопасны (идемпотентны)
  // и никогда не перезаписывают существующий профиль для того же user_id.
  rpc CreateProfileIfAbsent(CreateProfileIfAbsentRequest) returns (CreateProfileIfAbsentResponse);
}

// Запрос на создание (или проверку существования) профиля пользователя.
// Используется сервисом Identity при регистрации нового пользователя.
message CreateProfileIfAbsentRequest {
  // Диагностический UUID. Не дает прав доступа. Не должен попадать в публичные логи.
  string request_id = 1;

  // Стабилен при повторных попытках (retry) одной и той же операции регистрации.
  string registration_operation_id = 2;

  // Стабильный UUID пользователя, выбранный сервисом Identity.
  string user_id = 3;
}

// Ответ на запрос создания профиля.
message CreateProfileIfAbsentResponse {
  // UUID пользователя, для которого был создан (или найден) профиль.
  string user_id = 1;

  // READY означает, что профиль уже сохранён. Ошибки передаются статусом gRPC.
  CreationStatus status = 2;
}

// INVALID_ARGUMENT: некорректный UUID; UNAUTHENTICATED / PERMISSION_DENIED:
// ошибка service identity; FAILED_PRECONDITION: постоянная ошибка контракта.
// UNAVAILABLE, DEADLINE_EXCEEDED, RESOURCE_EXHAUSTED и ABORTED допускают повтор;
// неожиданный INTERNAL также повторяется с ограниченным backoff в Identity.

// Перечисление (Enum) статусов готовности профиля.
enum CreationStatus {
  // Статус не определен (значение по умолчанию, которого не должно быть в реальности).
  CREATION_STATUS_UNSPECIFIED = 0;

  // Профиль успешно сохранен в локальной базе данных сервиса Accounts.
  CREATION_STATUS_READY = 1;
}

// ==============================================================================
//                        ШПАРГАЛКА ПО ЭТОМУ КОНТРАКТУ
// ==============================================================================
//
// ЧТО ЭТО ТАКОЕ?
// Это файл контракта (Interface Definition Language - IDL) для gRPC.
// Он описывает, КАК микросервис Identity будет общаться с микросервисом Accounts.
// Мы (разработчики) пишем этот текст ВРУЧНУЮ.
//
// ЗАЧЕМ ОН НУЖЕН? (Аналогия)
// Представь, что Identity — это менеджер, а Accounts — это склад.
// Менеджеру нужно сказать складу: "Заведи профиль для пользователя с ID 123".
// Чтобы они поняли друг друга, им нужен общий язык (чертеж). Этот .proto файл
// и есть чертеж. В нем четко написано: "Запрос должен содержать поля request_id,
// registration_operation_id и user_id".
//
// ------------------------------------------------------------------------------
// ЧТО МЫ ТУТ ПОДКЛЮЧИЛИ И ЧТО СГЕНЕРИРУЕТСЯ (Как это работает под капотом)
// ------------------------------------------------------------------------------
//
// 1. `syntax = "proto3";`
//    Мы говорим, что используем 3-ю версию синтаксиса Protocol Buffers.
//
// 2. `option java_package = "...";`
//    Когда Maven-модуль `grpc-contracts` будет собирать проект, он прочитает
//    этот файл и сгенерирует Java-классы. Эта опция говорит:
//    "Положи сгенерированные Java-файлы в пакет io.github.returnaction.fitness.contracts..."
//
// 3. `service ProfileCreationService`
//    Мы описываем интерфейс (сервис). Из него сгенерируется Java-интерфейс.
//    Сервис Accounts будет реализовывать этот интерфейс (напишет логику),
//    а сервис Identity будет вызывать его методы (как клиент).
//
// 4. `rpc CreateProfileIfAbsent(...)`
//    Это метод (удаленный вызов процедуры).
//    Из этой строчки сгенерируются:
//    - Класс `CreateProfileIfAbsentRequest` (Java-объект с полями request_id, user_id...)
//    - Класс `CreateProfileIfAbsentResponse` (Java-объект для ответа)
//    - Метод для отправки запроса по сети.
//
// ------------------------------------------------------------------------------
// СВЯЗЬ С ДРУГИМИ ФАЙЛАМИ ПРОЕКТА
// ------------------------------------------------------------------------------
//
// - Этот файл лежит в папке `contracts/proto/`.
// - Рядом лежит папка `contracts/grpc-contracts/` (это Maven-модуль).
//   В его `pom.xml` настроен плагин, который берет файлы из `proto/` и генерирует
//   из них Java-код в папку `target/generated-sources/`.
// - Сервисы (`services/accounts-service` и `services/identity-service`)
//   подключают этот модуль как зависимость в Maven.
// - В итоге разработчики в Java-коде используют готовые методы,
//   которые были сгенерированы из этого текста.
//
// ВАЖНО: Никогда не редактируй сгенерированный Java-код в папке target вручную!
// Если нужно добавить поле — меняй этот .proto файл и пересобирай проект.
// ==============================================================================
