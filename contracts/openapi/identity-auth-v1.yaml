openapi: 3.1.1
info:
  title: Identity API
  version: 1.0.0
  description: |
    Внешний REST API Identity Service. Контракт не является API Python-приложения.
servers:
  - url: http://localhost:8080
    description: Пример для локальной разработки; реальный адрес задаётся конфигурацией окружения.
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Зарегистрировать пользователя и открыть первую сессию
      operationId: registerUser
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              basic:
                value:
                  email: anna@example.com
                  password: correct horse battery staple
      responses:
        '201':
          description: Аккаунт, профиль, кошелек и первая сессия готовы.
          headers:
            Cache-Control:
              description: Всегда `no-store`; ответы содержат токены.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                user:
                  id: 4652f81b-2b27-4e99-8c21-4336c716fc09
                  email: anna@example.com
                  status: ACTIVE
                session:
                  access_token: example-access-token
                  refresh_token: example-refresh-token
                  token_type: Bearer
                  expires_in: 900
                  refresh_expires_in: 2592000
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RegistrationUnavailable'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Войти в систему или возобновить подготовку к незавершенной регистрации
      description: |
        Корректные учетные данные для АКТИВНОГО аккаунта создают отдельную сессию входа.
        Корректные учетные данные для АККАУНТА В ОЖИДАНИИ (PENDING) возвращают статус
        registration_pending без токенов и могут ускорить процесс его регистрации.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Новая сессия входа и пара токенов.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Неверные учетные данные (без раскрытия статуса аккаунта).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Учетные данные верны, но аккаунт недоступен (заблокирован или в процессе удаления).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Регистрация еще не завершена (registration_pending) или вход временно недоступен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Обновить (ротировать) refresh-токен в рамках текущей сессии
      description: |
        Refresh-токены одноразовые. Повторное использование ранее использованного токена
        с правильным секретом аннулирует (отзывает) сессию. Неправильный секрет
        не отзывает её. Если ответ был потерян, повторная попытка со старым токеном
        потребует нового входа в систему.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Rotated token pair for the existing session.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Invalid, expired, revoked, or reused refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token is valid but the account is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Identity or signing configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Завершить сессию по refresh-токену
      operationId: logoutSession
      description: |
        Описано в спецификации 003. Независимый лимит: 30 запросов в минуту
        с IP. После проверки секрета Identity отзывает связанную сессию. Уже
        использованный refresh с правильным секретом тоже отзывает сессию.
        Для неизвестного, неверного или уже отозванного токена возвращается
        тот же 204. Ранее выданный access при локальной проверке может оставаться
        действительным до истечения своего срока, не более 15 минут.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refresh_token: example-refresh-token
      responses:
        '204':
          description: Запрос обработан; тело отсутствует. Ответ не раскрывает состояние токена.
        '400':
          description: Отсутствует тело запроса или JSON некорректен; код invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/LogoutValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      summary: Завершить все сессии текущего пользователя
      operationId: logoutAllSessions
      description: |
        Описано в спецификации 003. Независимый лимит: 30 запросов в минуту
        с IP. Нужен действующий access-токен и активная сессия. После фиксации
        отзыва всех сессий, включая текущую, возвращается 204. Повтор с тем же
        отозванным access-токеном получает 401. Access-токены, ранее выданные
        другим устройствам, при локальной проверке могут действовать до истечения
        срока, не более 15 минут. Тело запроса не требуется.
      security:
        - BearerAccess: []
      responses:
        '204':
          description: Сессии отозваны; тело отсутствует.
        '401':
          description: Отсутствующий, невалидный, истёкший или отозванный access; код invalid_access_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
components:
  securitySchemes:
    BearerAccess:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Криптографически сгенерированный UUID v4. При повторной отправке запроса
        на регистрацию используйте тот же самый ключ. Этот ключ не является
        данными для входа (аутентификации).
      schema:
        type: string
        format: uuid
  schemas:
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: Непустой refresh-токен. Пустое или отсутствующее поле возвращает 422.
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: |
            Leading and trailing whitespace is removed before validation. The
            resulting address is 3–254 printable ASCII characters with exactly
            one @ and a nonempty part on each side. Comparison is case-insensitive.
            Unicode and IDN addresses are not supported in v1.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: |
            From 1 to 128 Unicode characters and at most 1024 UTF-8 bytes. The
            server does not normalize or silently truncate it.
    RegisterResponse:
      type: object
      additionalProperties: false
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/RegisteredUser'
        session:
          $ref: '#/components/schemas/SessionTokens'
    RegisteredUser:
      type: object
      additionalProperties: false
      required: [id, email, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Canonical ASCII address accepted by the registration rules.
        status:
          type: string
          const: ACTIVE
    SessionTokens:
      type: object
      additionalProperties: false
      required:
        [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 900
        refresh_expires_in:
          type: integer
          const: 2592000
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 0
          maximum: 900
        refresh_expires_in:
          type: integer
          minimum: 0
          maximum: 2592000
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field:
                    type: string
                  code:
                    type: string
            request_id:
              type: string
              format: uuid
  responses:
    LogoutValidationError:
      description: Поле refresh_token отсутствует, пусто или превышает допустимую длину; код validation_error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdentityUnavailable:
      description: Identity или база временно недоступны; код identity_unavailable. Успех отзыва не подтверждается.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: Клиент не принимает application/json. Ответ без тела.
    UnsupportedMediaType:
      description: Неподдерживаемый Content-Type запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unsupported_media_type
              message: Content type is not supported.
              details: []
              request_id: 2c160d4b-0f61-4702-99e1-99713d0c9326
    InvalidRequest:
      description: Invalid JSON or a missing/invalid Idempotency-Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_request
              message: Check the request format.
              request_id: 2c160d4b-0f61-4702-99e1-99713d0c9326
    ValidationError:
      description: The email or password violates v1 validation rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_error
              message: Check the submitted data.
              details:
                - field: email
                  code: invalid_format
              request_id: 2c160d4b-0f61-4702-99e1-99713d0c9326
    Conflict:
      description: |
        `email_already_registered` means another operation owns the normalized
        email. `idempotency_key_conflict` means the same key was sent with
        different credentials; the response does not identify the differing field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the client can retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: Try again later.
              request_id: 2c160d4b-0f61-4702-99e1-99713d0c9326
    RegistrationUnavailable:
      description: |
        Provisioning has not completed within the configured wait or is
        temporarily unavailable. Retry with the same Idempotency-Key and
        password; no session or token is issued.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected failure without internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
