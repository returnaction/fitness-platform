openapi: 3.1.1
info:
  title: Identity API
  version: 1.0.0
  description: |
    Внешний REST API Identity Service. Этот контракт описывает регистрацию
    пользователя первой версии и не является API текущего Python-приложения.
servers:
  - url: http://localhost:8080
    description: Пример для локальной разработки; реальный адрес задаётся конфигурацией окружения.
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Зарегистрировать пользователя и открыть первую сессию
      operationId: registerUser
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              basic:
                value:
                  email: anna@example.com
                  password: correct horse battery staple
      responses:
        '201':
          description: Аккаунт, профиль, кошелек и первая сессия готовы.
          headers:
            Cache-Control:
              description: Всегда `no-store`; ответы содержат токены.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                user:
                  id: 4652f81b-2b27-4e99-8c21-4336c716fc09
                  email: anna@example.com
                  status: ACTIVE
                session:
                  access_token: example-access-token
                  refresh_token: example-refresh-token
                  token_type: Bearer
                  expires_in: 900
                  refresh_expires_in: 2592000
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RegistrationUnavailable'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Войти в систему или возобновить подготовку к незавершенной регистрации
      description: |
        Корректные учетные данные для АКТИВНОГО аккаунта создают отдельную сессию входа.
        Корректные учетные данные для АККАУНТА В ОЖИДАНИИ (PENDING) возвращают статус
        registration_pending без токенов и могут ускорить процесс его регистрации.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Новая сессия входа и пара токенов.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Неверные учетные данные (без раскрытия статуса аккаунта).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Учетные данные верны, но аккаунт недоступен (заблокирован или в процессе удаления).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Регистрация еще не завершена (registration_pending) или вход временно недоступен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Обновить (ротировать) refresh-токен в рамках текущей сессии
      description: |
        Refresh-токены одноразовые. Повторное использование ранее использованного токена
        с правильным секретом аннулирует (отзывает) сессию. Неправильный секрет
        не отзывает её. Если ответ был потерян, повторная попытка со старым токеном
        потребует нового входа в систему.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Rotated token pair for the existing session.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Invalid, expired, revoked, or reused refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token is valid but the account is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Identity or signing configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Криптографически сгенерированный UUID v4. При повторной отправке запроса
        на регистрацию используйте тот же самый ключ. Этот ключ не является
        данными для входа (аутентификации).
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: |
            Leading and trailing whitespace is removed before validation. The
            resulting address is 3–254 printable ASCII characters with exactly
            one @ and a nonempty part on each side. Comparison is case-insensitive.
            Unicode and IDN addresses are not supported in v1.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: |
            From 1 to 128 Unicode characters and at most 1024 UTF-8 bytes. The
            server does not normalize or silently truncate it.
    RegisterResponse:
      type: object
      additionalProperties: false
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/RegisteredUser'
        session:
          $ref: '#/components/schemas/SessionTokens'
    RegisteredUser:
      type: object
      additionalProperties: false
      required: [id, email, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Canonical ASCII address accepted by the registration rules.
        status:
          type: string
          const: ACTIVE
    SessionTokens:
      type: object
      additionalProperties: false
      required:
        [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 900
        refresh_expires_in:
          type: integer
          const: 2592000
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 0
          maximum: 900
        refresh_expires_in:
          type: integer
          minimum: 0
          maximum: 2592000
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field:
                    type: string
                  code:
                    type: string
            request_id:
              type: string
              format: uuid
  responses:
    InvalidRequest:
      description: Invalid JSON or a missing/invalid Idempotency-Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_request
              message: Check the request format.
              request_id: 2c160d4b-0f61-4702-99e1-99713d0c9326
    ValidationError:
      description: The email or password violates v1 validation rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_error
              message: Check the submitted data.
              details:
                - field: email
                  code: invalid_format
              request_id: 2c160d4b-0f61-4702-99e1-99713d0c9326
    Conflict:
      description: |
        `email_already_registered` means another operation owns the normalized
        email. `idempotency_key_conflict` means the same key was sent with
        different credentials; the response does not identify the differing field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Registration limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the client can retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: Try again later.
              request_id: 2c160d4b-0f61-4702-99e1-99713d0c9326
    RegistrationUnavailable:
      description: |
        Provisioning has not completed within the configured wait or is
        temporarily unavailable. Retry with the same Idempotency-Key and
        password; no session or token is issued.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected failure without internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
