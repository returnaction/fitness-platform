# Это папка с настройками запуска Maven.
# Точка в начале — просто принятое имя для служебных папок.

#           Зачем нужен файл настроек
# Когда ты запускаешь mvnw.cmd, он читает maven-wrapper.properties.
# Файл говорит ему: «Используй Maven версии 3.9.11».
# Если такой Maven ещё не скачан, скрипт скачает его, а потом выполнит твою команду. Например: .\mvnw.cmd test
# То-есть тебе не нужно отдельно устанавливать Maven — проект сам запускает нужную версию.

#           Что означают строки
#wrapperVersion=3.3.4 — версия самого механизма запуска Wrapper.
wrapperVersion=3.3.4
#distributionType=only-script — Wrapper запускается скриптами, без отдельного дополнительного файла.
distributionType=only-script
#distributionUrl=...3.9.11...zip — откуда скачать Maven версии 3.9.11.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip

#           Для тех кто не понял
# Допустим, ты пришёл к коллеге и получил этот проект. Хочешь проверить, собирается ли он.
# Если запускать обычный Maven Ты вводишь: mvn test
# Но команда mvn запускает тот Maven, который установлен у тебя на компьютере. У коллеги может быть Maven 3.9.11, а у тебя — 3.8.6.
# Это иногда приводит к ситуации: у него проект собирается, а у тебя — нет.
# В этом проекте можно запускать так .\mvnw.cmd test
# mvnw.cmd — это маленький помощник. Он смотрит в .mvn\wrapper\maven-wrapper.properties и видит: distributionUrl=...apache-maven-3.9.11-bin.zip
# То есть: «Для этого проекта нужен Maven 3.9.11».
# Если нужной версии Maven ещё нет на компьютере, помощник скачает её. Затем выполнит команду test именно с этой версией. У коллеги команда будет такая: ./mvnw test

#       Андрей отправил проект Васе
# В репозитории есть папка проекта:
# myappproject\
#├── mvnw.cmd
#├── .mvn\
#├── pom.xml
#└── services\
#    ├── identity-service\
#    │   └── pom.xml
#    ├── accounts-service\
#    │   └── pom.xml
#    └── coins-service\
#        └── pom.xml

# У Васи другой Maven — или Maven вообще не установлен. Это не проблема: Вася запускает сборку через файлы, которые Андрей положил в проект. Они скачивают нужную версию Maven.
# Сначала он переходит в корень проекта: cd C:\Projects\java\myappproject
# Затем запускает тесты: .\mvnw.cmd test
# Это читается так: .\mvnw.cmd — запусти скрипт mvnw.cmd из текущей папки;

#Какие тесты запустятся?
#Вася запустил команду из корня myappproject, где лежит главный pom.xml. В нём перечислены модули: gRPC-контракты и три микросервиса.
#
#Поэтому команда из корня запускает тесты по всем этим модулям. Если тесты одного модуля упадут, Maven сообщит об ошибке, и сборка будет неуспешной.

# А если Вася хочет проверить только один микросервис?
# Из корня проекта он может написать: .\mvnw.cmd -pl services/identity-service test
#-pl services/identity-service означает: «выбери только модуль identity-service».
# Или перейти прямо в папку микросервиса: cd C:\Projects\java\myappproject\services\identity-service ..\..\mvnw.cmd test
#Здесь ..\..\mvnw.cmd — путь от папки микросервиса обратно к скрипту в корне. А Maven использует pom.xml из текущей папки, то есть тестирует только identity-service.
#
#Самое главное: mvnw.cmd запускает Maven, test просит его проверить код, а папка, из которой Вася запускает команду, определяет, какой pom.xml использовать: корневой — все модули, папка микросервиса — только этот микросервис.

