# ==============================================================================
#                       ШПАРГАЛКА ПО MAVEN WRAPPER
# ==============================================================================
#
# Проблема, которую решает Maven Wrapper:
# Допустим, разработчик Андрей создал проект "myappproject" и залил его на Git.
# Андрей использовал Maven версии 3.9.11 (она прописана в этом файле ниже).
#
# Разработчик Вася скачал проект. Но у Васи на компьютере установлен Maven 3.8.6,
# или его вообще нет. Если Вася запустит сборку обычной командой "mvn test",
# проект может не собраться из-за разницы версий (у Андрея работает, у Васи - нет).
#
# Чтобы Васе не пришлось вручную искать и устанавливать Maven 3.9.11, Андрей
# добавил в проект три специальных файла. Они работают как "портативный Maven".
#
# ------------------------------------------------------------------------------
#                   ЗА ЧТО ОТВЕЧАЮТ 3 ФАЙЛА:
# ------------------------------------------------------------------------------
#
# 1. .mvn/wrapper/maven-wrapper.properties (этот файл)
#    - Это "мозг" обертки. Он говорит скриптам: "Для этого проекта нужен
#      именно Maven версии 3.9.11, и вот ссылка, откуда его скачать".
#
# 2. mvnw (Maven Wrapper)
#    - Это скрипт для Linux и macOS (а также для терминала Git Bash на Windows).
#    - Вася (если он на Mac) просто пишет в терминале: ./mvnw test
#
# 3. mvnw.cmd (Maven Wrapper Command)
#    - Это скрипт для стандартной командной строки Windows (cmd или PowerShell).
#    - Вася (если он на Windows) пишет в терминале: .\mvnw.cmd test
#
# ------------------------------------------------------------------------------
#               КАК ЭТО РАБОТАЕТ НА ПРАКТИКЕ (Сценарий Васи):
# ------------------------------------------------------------------------------
#
# 1. Вася клонирует проект из Git.
# 2. Вася открывает терминал в корне проекта (где лежит главный pom.xml).
# 3. Вася запускает тесты командой: .\mvnw.cmd test
#
# Что происходит дальше?
# - Скрипт mvnw.cmd видит, что Вася на Windows.
# - Он заглядывает в этот самый файл (maven-wrapper.properties).
# - Он читает строку distributionUrl и понимает: "Ага, нужен Maven 3.9.11".
# - Он проверяет папку на компьютере Васи (обычно C:\Users\Вася\.m2\wrapper\dists).
# - Если Maven 3.9.11 там уже есть — он просто запускает команду test.
# - Если его там нет — скрипт САМ скачивает нужную версию из интернета,
#   распаковывает её во временную папку и запускает команду test.
#
# ИТОГ: Васе не нужно ничего настраивать, устанавливать и читать инструкции.
# Проект сам скачает нужную версию Maven и обеспечит одинаковую сборку
# на компьютерах у всех разработчиков.
#
# ==============================================================================
#           НАСТРОЙКИ (НЕ УДАЛЯТЬ, ОНИ НУЖНЫ ДЛЯ РАБОТЫ СКРИПТОВ)
# ==============================================================================

# Версия самого механизма запуска Wrapper.
wrapperVersion=3.3.4

# Тип дистрибутива: только скрипт (без лишних jar-файлов).
distributionType=only-script

# Ссылка откуда скачать Maven. Именно эту версию (3.9.11) скачает Вася.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
